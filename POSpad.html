<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSpad - Cafe de bish Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="crest-icon.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="POSpad">
    <link rel="apple-touch-icon" href="crest-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fdfbf7; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2d9c5; border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden bg-[#fdfbf7] text-slate-800">

    <!-- Top Header Bar -->
    <header class="h-20 bg-white border-b border-amber-200/60 px-6 flex items-center justify-between shrink-0 shadow-sm z-20">
        <div class="flex items-center gap-4">
            <!-- POSpad Splash Logo (Shield & Green Box Removed) -->
            <div class="h-16 w-16 flex items-center justify-center shrink-0">
                <img src="POSpadLogo.png" alt="POSpad Logo" class="h-full w-full object-contain drop-shadow-sm">
            </div>
            
            <div class="flex flex-col">
                <span class="text-xs font-bold tracking-widest text-amber-600 uppercase">Cafe de bish</span>
                <h1 class="text-lg font-black tracking-tight text-slate-900">iPad Register</h1>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div id="connectionIndicator" class="flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-semibold text-emerald-700">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Live Sync Active</span>
            </div>
            <button onclick="openActiveOrdersModal()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-sm">
                Active Orders / Delivery Board
            </button>
        </div>
    </header>

    <!-- Main Register Layout -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-hidden">
        
        <!-- Left 2 Columns: Product Menu & Categories -->
        <section class="lg:col-span-2 flex flex-col bg-white border border-amber-200/60 rounded-3xl overflow-hidden shadow-sm">
            <!-- Category Tabs -->
            <div class="p-4 bg-amber-50/50 border-b border-amber-100 flex gap-2 overflow-x-auto shrink-0">
                <button onclick="switchCategory('coffee')" class="cat-btn px-4 py-2 bg-amber-500 text-slate-950 rounded-xl text-xs font-bold shadow-sm transition shrink-0">Coffee</button>
                <button onclick="switchCategory('snacks')" class="cat-btn px-4 py-2 bg-white text-slate-700 hover:bg-amber-50 rounded-xl text-xs font-bold transition shrink-0 border border-amber-200/60">Snacks</button>
                <button onclick="switchCategory('drinks')" class="cat-btn px-4 py-2 bg-white text-slate-700 hover:bg-amber-50 rounded-xl text-xs font-bold transition shrink-0 border border-amber-200/60">Drinks</button>
                <button onclick="switchCategory('food')" class="cat-btn px-4 py-2 bg-white text-slate-700 hover:bg-amber-50 rounded-xl text-xs font-bold transition shrink-0 border border-amber-200/60">Food</button>
                <button onclick="switchCategory('all')" class="cat-btn px-4 py-2 bg-white text-slate-700 hover:bg-amber-50 rounded-xl text-xs font-bold transition shrink-0 border border-amber-200/60">All Items</button>
            </div>
            
            <!-- Products Grid -->
            <div class="flex-1 p-6 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4 content-start" id="productGrid"></div>
        </section>

        <!-- Right Column: Cart & Checkout -->
        <section class="flex flex-col bg-white border border-amber-200/60 rounded-3xl overflow-hidden shadow-sm">
            <div class="p-5 bg-amber-50/50 border-b border-amber-100 space-y-3 shrink-0">
                <h2 class="font-bold text-sm text-slate-900 uppercase tracking-wide">Current Order</h2>
                <input type="text" id="customerName" placeholder="Customer Name (e.g. John Doe)" class="w-full p-2.5 bg-white border border-amber-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none shadow-sm">
                <input type="text" id="customerLocation" placeholder="Delivery Location (e.g. Staff Room / Table 4)" class="w-full p-2.5 bg-white border border-amber-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none shadow-sm">
            </div>

            <!-- Cart Items List -->
            <div class="flex-1 p-4 overflow-y-auto space-y-2.5" id="cartContainer">
                <div class="text-center py-16 text-slate-400">
                    <p class="text-sm font-medium">Cart is empty</p>
                    <p class="text-xs text-slate-400 mt-1">Tap items on the left to add</p>
                </div>
            </div>

            <!-- Checkout Summary & Actions -->
            <div class="p-5 bg-amber-50/50 border-t border-amber-100 space-y-4 shrink-0">
                <div class="flex justify-between items-center text-sm font-bold text-slate-700">
                    <span>Total Amount</span>
                    <span id="cartTotal" class="text-amber-600 text-lg font-black">$0.00</span>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPayment('cash')" id="payCash" class="py-2 px-2 bg-amber-500 text-slate-950 rounded-xl text-xs font-bold shadow-sm transition">Cash</button>
                    <button onclick="setPayment('eftpos')" id="payEftpos" class="py-2 px-2 bg-white hover:bg-amber-50 text-slate-700 border border-amber-200 rounded-xl text-xs font-bold transition">EFTPOS</button>
                    <button onclick="setPayment('later')" id="payLater" class="py-2 px-2 bg-white hover:bg-amber-50 text-slate-700 border border-amber-200 rounded-xl text-xs font-bold transition">Pay Later</button>
                </div>

                <div id="cashBox" class="bg-amber-100/60 p-3 rounded-xl border border-amber-200 space-y-2">
                    <div class="flex justify-between items-center text-xs font-bold text-amber-900">
                        <span>Cash Given ($):</span>
                        <input type="number" id="cashGiven" oninput="calculateChange()" class="w-24 p-1 text-right bg-white border border-amber-300 rounded-lg text-xs font-bold text-slate-800 focus:outline-none" placeholder="0.00">
                    </div>
                    <div class="flex justify-between items-center text-xs font-bold text-slate-700 pt-1 border-t border-amber-200/60">
                        <span>Change Due:</span>
                        <span id="changeDue" class="text-emerald-600 text-xs font-black">$0.00</span>
                    </div>
                </div>

                <button onclick="submitOrder()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl text-xs font-bold shadow-md transition">SUBMIT ORDER TO KITCHEN</button>
            </div>
        </section>

    </main>

    <!-- Coffee Customization Modal -->
    <div id="coffeeModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-amber-200 space-y-4">
            <h3 class="text-base font-bold text-slate-900" id="modalCoffeeTitle">Customize Coffee</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-600 uppercase mb-1">Shot Type</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectShotType('Short')" id="shotShort" class="py-2 bg-amber-500 text-slate-950 rounded-xl font-bold transition">Short</button>
                        <button onclick="selectShotType('Long')" id="shotLong" class="py-2 bg-slate-100 text-slate-700 rounded-xl font-bold transition">Long</button>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-600 uppercase mb-1">Size & Price</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectCoffeeSize('Small', 2.50)" id="sizeSm" class="py-2 bg-amber-500 text-slate-950 rounded-xl font-bold transition">Small ($2.50)</button>
                        <button onclick="selectCoffeeSize('Med/Large', 3.50)" id="sizeMed" class="py-2 bg-slate-100 text-slate-700 rounded-xl font-bold transition">Med/Large ($3.50)</button>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-600 uppercase mb-1">Milk Choice</label>
                    <select id="coffeeMilk" class="w-full p-2.5 bg-slate-50 border border-amber-200 rounded-xl text-xs font-medium">
                        <option value="Full Cream">Full Cream</option>
                        <option value="Light Milk">Light Milk</option>
                        <option value="Skim Milk">Skim Milk</option>
                        <option value="Oat">Oat</option>
                        <option value="Soy">Soy</option>
                        <option value="Almond">Almond</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-600 uppercase mb-1">Notes</label>
                    <input type="text" id="coffeeNotes" placeholder="e.g. Extra hot" class="w-full p-2.5 bg-slate-50 border border-amber-200 rounded-xl text-xs">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeCoffeeModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">Cancel</button>
                <button onclick="confirmCoffeeAdd()" class="flex-1 py-2.5 bg-amber-500 text-slate-950 rounded-xl text-xs font-bold shadow">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- Active Orders Modal -->
    <div id="activeOrdersModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl border border-amber-200">
            <div class="p-5 bg-amber-50/50 border-b border-amber-100 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-base text-slate-900">Active Orders & Delivery Board</h3>
                <button onclick="closeActiveOrdersModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold px-2">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4" id="activeOrdersListContainer"></div>
            <div class="p-4 bg-amber-50/50 border-t border-amber-100 flex justify-end shrink-0">
                <button onclick="closeActiveOrdersModal()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl shadow">Close Board</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8000'
            : window.location.origin;

        let masterProducts = [
            { id: 'c1', name: 'Long Black Coffee', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c2', name: 'Short Black Coffee', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c3', name: 'Flat White', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c4', name: 'Long Macchiato', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c5', name: 'Short Macchiato', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c6', name: 'Latte', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c7', name: 'Cappuccino', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c8', name: 'Mocha', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c9', name: 'Iced Coffee', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c10', name: 'Affogato', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 'c11', name: 'Piccolo', category: 'coffee', price: 2.50, inStock: true, image: '' },
            { id: 't1', name: 'Caramel Slice', category: 'snacks', price: 3.00, inStock: true, image: '' },
            { id: 't2', name: 'Lemon Slice', category: 'snacks', price: 3.00, inStock: true, image: '' },
            { id: 't3', name: 'Hedgehog Slice', category: 'snacks', price: 3.00, inStock: true, image: '' },
            { id: 't4', name: 'Melting Moments', category: 'snacks', price: 3.00, inStock: true, image: '' },
            { id: 't5', name: 'Yoghurt Pots with Berries and Honey', category: 'snacks', price: 4.00, inStock: true, image: '' },
            { id: 'd1', name: 'Hudson Lemonade', category: 'drinks', price: 2.50, inStock: true, image: '' },
            { id: 'd2', name: 'Orange Sunrise', category: 'drinks', price: 2.50, inStock: true, image: '' },
            { id: 'm1', name: 'Chocolate Milkshake', category: 'drinks', price: 3.50, inStock: true, image: '' },
            { id: 'm2', name: 'Caramel Milkshake', category: 'drinks', price: 3.50, inStock: true, image: '' },
            { id: 'm3', name: 'Strawberry Milkshake', category: 'drinks', price: 3.50, inStock: true, image: '' },
            { id: 's1', name: 'Bahn Mi with Chicken', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 's2', name: 'Bahn Mi with Crispy Pork', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 's3', name: 'Reuben Sandwich', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 's4', name: 'Cuban Sandwich', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 's5', name: "Bellingham's Club Sandwich", category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 's6', name: "Mbappe's Croque Monsieur", category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 's7', name: 'Egg Sandwich', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 'w1', name: 'Chicken Caesar Wrap', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 'w2', name: 'Tandoori Chicken Wrap', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 'ds1', name: 'Butter Chicken with Rice', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 'ds2', name: 'Chicken Biryani with Rice', category: 'food', price: 7.00, inStock: true, image: '' },
            { id: 'ds3', name: 'Pumpkin Soup', category: 'food', price: 5.00, inStock: true, image: '' },
            { id: 'ds4', name: 'Thai Chicken and Pumpkin Soup', category: 'food', price: 5.00, inStock: true, image: '' }
        ];

        let orders = [];
        let cart = [];
        let paymentMethod = 'cash';
        let activeCategory = 'coffee';
        let currentCoffeeItem = null;
        let selectedShotType = 'Short';
        let selectedCoffeeSizeName = 'Small';
        let selectedCoffeePrice = 2.50;

        window.onload = async function() {
            await fetchServerData();
            renderProducts(activeCategory);
            setInterval(fetchServerData, 1500);
        };

        async function fetchServerData() {
            try {
                const res = await fetch(`${API_BASE}/api/orders`);
                const data = await res.json();
                if (data.products && data.products.length > 0) masterProducts = data.products;
                if (data.orders) orders = data.orders;
                renderProducts(activeCategory);
            } catch (e) {
                console.error("Sync error:", e);
            }
        }

        async function pushToServer() {
            try {
                await fetch(`${API_BASE}/api/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orders: orders, products: masterProducts })
                });
            } catch (e) {
                console.error("Push error:", e);
            }
        }

        function switchCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 bg-white text-slate-700 hover:bg-amber-50 rounded-xl text-xs font-bold transition shrink-0 border border-amber-200/60";
            });
            event.target.className = "cat-btn px-4 py-2 bg-amber-500 text-slate-950 rounded-xl text-xs font-bold shadow-sm transition shrink-0";
            renderProducts(cat);
        }

        function renderProducts(cat) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const filtered = (cat === 'all' ? masterProducts : masterProducts.filter(p => (p.category || '').toLowerCase() === cat)).filter(p => p.inStock !== false);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 text-sm">No items available in this category.</div>`;
                return;
            }

            filtered.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-3.5 border border-amber-200/60 shadow-sm hover:shadow-md transition flex flex-col justify-between cursor-pointer group';
                card.onclick = () => handleProductClick(prod);
                const imgSrc = prod.image ? prod.image : `https://placehold.co/150x150/ffb612/005b45?text=${encodeURIComponent(prod.name)}`;

                card.innerHTML = `
                    <div>
                        <div class="w-full h-24 bg-amber-50 rounded-xl overflow-hidden mb-2.5 relative">
                            <img src="${imgSrc}" class="w-full h-full object-cover group-hover:scale-105 transition">
                            <span class="absolute top-2 right-2 bg-amber-500 text-slate-950 text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">$${prod.price.toFixed(2)}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-xs line-clamp-2">${prod.name}</h4>
                    </div>
                    <div class="mt-2 text-right"><span class="text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-1 rounded-lg">Tap to Add</span></div>
                `;
                grid.appendChild(card);
            });
        }

        function handleProductClick(prod) {
            const isCoffee = prod.category === 'coffee' || prod.name.toLowerCase().includes('coffee') || prod.name.toLowerCase().includes('latte') || prod.name.toLowerCase().includes('cappuccino') || prod.name.toLowerCase().includes('flat white');
            if (isCoffee) {
                currentCoffeeItem = prod;
                selectedShotType = 'Short';
                selectedCoffeeSizeName = 'Small';
                selectedCoffeePrice = 2.50;
                document.getElementById('modalCoffeeTitle').innerText = `Customize: ${prod.name}`;
                document.getElementById('coffeeModal').classList.remove('hidden');
            } else {
                cart.push({ id: prod.id, name: prod.name, price: prod.price, details: '', notes: '' });
                updateCartUI();
            }
        }

        function selectShotType(shot) {
            selectedShotType = shot;
            document.getElementById('shotShort').className = shot === 'Short' ? 'py-2 bg-amber-500 text-slate-950 rounded-xl font-bold transition' : 'py-2 bg-slate-100 text-slate-700 rounded-xl font-bold transition';
            document.getElementById('shotLong').className = shot === 'Long' ? 'py-2 bg-amber-500 text-slate-950 rounded-xl font-bold transition' : 'py-2 bg-slate-100 text-slate-700 rounded-xl font-bold transition';
        }

        function selectCoffeeSize(size, price) {
            selectedCoffeeSizeName = size;
            selectedCoffeePrice = price;
            document.getElementById('sizeSm').className = size === 'Small' ? 'py-2 bg-amber-500 text-slate-950 rounded-xl font-bold transition' : 'py-2 bg-slate-100 text-slate-700 rounded-xl font-bold transition';
            document.getElementById('sizeMed').className = size !== 'Small' ? 'py-2 bg-amber-500 text-slate-950 rounded-xl font-bold transition' : 'py-2 bg-slate-100 text-slate-700 rounded-xl font-bold transition';
        }

        function closeCoffeeModal() {
            document.getElementById('coffeeModal').classList.add('hidden');
            currentCoffeeItem = null;
        }

        function confirmCoffeeAdd() {
            if (!currentCoffeeItem) return;
            const milk = document.getElementById('coffeeMilk').value;
            const notes = document.getElementById('coffeeNotes').value;
            cart.push({
                id: currentCoffeeItem.id + '-' + Date.now(),
                name: currentCoffeeItem.name,
                price: selectedCoffeePrice,
                details: `${selectedShotType} Shot, ${selectedCoffeeSizeName}, ${milk} Milk`,
                notes: notes
            });
            closeCoffeeModal();
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartContainer');
            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400"><p class="text-sm font-medium">Cart is empty</p><p class="text-xs text-slate-400 mt-1">Tap items on the left to add</p></div>`;
                document.getElementById('cartTotal').innerText = '$0.00';
                return;
            }
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-2.5 bg-amber-50/40 rounded-xl border border-amber-100 text-xs';
                div.innerHTML = `
                    <div class="flex-1 pr-2"><div class="font-bold text-slate-800">${item.name}</div>${item.details ? `<div class="text-slate-500">${item.details}</div>` : ''}</div>
                    <div class="font-bold text-slate-700 mr-2">$${item.price.toFixed(2)}</div>
                    <button onclick="cart.splice(${idx},1); updateCartUI();" class="text-red-400 font-bold px-1">&times;</button>
                `;
                container.appendChild(div);
            });
            document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
            if (paymentMethod === 'cash') calculateChange();
        }

        function setPayment(method) {
            paymentMethod = method;
            ['cash', 'eftpos', 'later'].forEach(m => {
                const btn = document.getElementById(`pay${m.charAt(0).toUpperCase() + m.slice(1)}`);
                btn.className = m === method ? 'py-2 px-2 bg-amber-500 text-slate-950 rounded-xl text-xs font-bold shadow-sm transition' : 'py-2 px-2 bg-white hover:bg-amber-50 text-slate-700 border border-amber-200 rounded-xl text-xs font-bold transition';
            });
            const cashBox = document.getElementById('cashBox');
            if (method === 'cash') { cashBox.classList.remove('hidden'); calculateChange(); } else { cashBox.classList.add('hidden'); }
        }

        function calculateChange() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const given = parseFloat(document.getElementById('cashGiven').value) || 0;
            const change = given - total;
            const changeEl = document.getElementById('changeDue');
            if (change >= 0) { changeEl.innerText = `$${change.toFixed(2)}`; changeEl.className = 'text-emerald-600 text-xs font-black'; }
            else { changeEl.innerText = `Short $${Math.abs(change).toFixed(2)}`; changeEl.className = 'text-red-500 text-xs font-black'; }
        }

        async function submitOrder() {
            const name = document.getElementById('customerName').value.trim() || 'Student Customer';
            const location = document.getElementById('customerLocation').value.trim() || 'Classroom / Pickup';
            if (cart.length === 0) { alert("Cart is empty."); return; }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const paymentStr = paymentMethod === 'cash' ? 'Paid (Cash)' : paymentMethod === 'eftpos' ? 'Paid (EFTPOS)' : 'Unpaid (Pay Later)';

            const newOrder = {
                id: Date.now(),
                customer: name,
                location: location,
                items: cart.map(i => `${i.name} ${i.details ? '('+i.details+')' : ''} ${i.notes ? '['+i.notes+']' : ''}`).join(', '),
                total: total,
                payment: paymentStr,
                status: 'New',
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            orders.unshift(newOrder);
            cart = [];
            document.getElementById('customerName').value = '';
            document.getElementById('customerLocation').value = '';
            updateCartUI();
            await pushToServer();
            alert("Order sent successfully to OrderUp kitchen!");
        }

        function openActiveOrdersModal() {
            renderActiveOrdersList();
            document.getElementById('activeOrdersModal').classList.remove('hidden');
        }

        function closeActiveOrdersModal() {
            document.getElementById('activeOrdersModal').classList.add('hidden');
        }

        function renderActiveOrdersList() {
            const container = document.getElementById('activeOrdersListContainer');
            const activeOrDelivery = orders.filter(o => o.status !== 'Delivered' && o.status !== 'Cancelled');
            if (activeOrDelivery.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-12">No active or pending orders.</p>`;
                return;
            }
            container.innerHTML = activeOrDelivery.map(o => `
                <div class="flex items-center justify-between p-4 bg-slate-50 border border-amber-200/60 rounded-2xl">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${o.status === 'New' ? 'bg-amber-100 text-amber-800' : o.status === 'In Progress' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'}">${o.status}</span>
                            <span class="text-xs font-mono text-slate-400">${o.time}</span>
                        </div>
                        <h4 class="font-bold text-sm text-slate-800 mt-1">${o.customer} <span class="text-amber-700 font-medium">(${o.location})</span></h4>
                        <p class="text-xs text-slate-600 mt-1">${o.items}</p>
                    </div>
                    <div class="flex flex-col items-end gap-2">
                        <span class="text-xs font-bold text-emerald-600">$${o.total.toFixed(2)}</span>
                        ${o.status === 'Out for Delivery' ? `<button onclick="confirmDelivery(${o.id})" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow">Confirm Delivery</button>` : `<span class="text-[10px] text-slate-400 font-medium">Kitchen Processing</span>`}
                    </div>
                </div>
            `).join('');
        }

        async function confirmDelivery(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                order.status = 'Delivered';
                await pushToServer();
                renderActiveOrdersList();
            }
        }
    </script>
</body>
</html>
